
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: transparent !important;
  font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
}

body {
  overflow: hidden;
}

.chart-container {
  position: relative;
  width: 100%;
  max-width: 1160px;
  aspect-ratio: 1160 / 620;
  margin: 0 auto;
  background: transparent !important;
}

svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}

/* 浅色辅助线 */
.grid-line {
  stroke: #9eabb2;
  stroke-width: 1;
  stroke-dasharray: 4 8;
  opacity: 0.23;
}

/* 坐标文字 */
.axis-label {
  fill: #b6bfc4;
  font-size: 17px;
  font-weight: 400;
}

/* 橙色折线 */
.fire-line {
  fill: none;
  stroke: #d88b58;
  stroke-width: 4;
  stroke-linecap: round;
  stroke-linejoin: round;
  filter: drop-shadow(
    0 0 4px rgba(216,139,88,0.18)
  );
}

/* 数据点 */
.fire-point {
  fill: #d88b58;
  stroke: #f1c6a7;
  stroke-width: 2.5;
  cursor: pointer;
  transition:
    r 0.2s ease,
    fill 0.2s ease;
}

.point-ring {
  fill: none;
  stroke: #d88b58;
  stroke-width: 2;
  opacity: 0;
  pointer-events: none;
}

.point-group.active .point-ring {
  opacity: 0.75;
}

.point-group.active .fire-point {
  fill: #f3b787;
}

/* 悬停提示框 */
.tooltip {
  position: absolute;
  z-index: 10;
  min-width: 145px;
  padding: 13px 17px;
  border: 1px solid rgba(217,145,93,0.6);
  border-radius: 5px;
  background: rgba(30,39,45,0.94);
  box-shadow: 0 6px 25px rgba(0,0,0,0.15);
  pointer-events: none;
  opacity: 0;
  transform: translate(-50%,-115%);
  transition: opacity 0.18s ease;
}

.tooltip.show {
  opacity: 1;
}

.tooltip-year {
  color: #c4cbd0;
  font-size: 14px;
  margin-bottom: 5px;
}

.tooltip-value {
  color: #e9a574;
  font-size: 27px;
  font-weight: 600;
  white-space: nowrap;
}

/* 单位 */
.unit-label {
  fill: #b6bfc4;
  font-size: 15px;
}

/* 重播按钮 */
.replay {
  position: absolute;
  right: 3%;
  bottom: 3%;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: 1px solid rgba(210,150,110,0.45);
  background: rgba(45,45,45,0.18);
  color: #d99b70;
  cursor: pointer;
  display: grid;
  place-items: center;
}

.replay:hover {
  background: rgba(216,139,88,0.15);
}

.replay svg {
  width: 21px;
  height: 21px;
}

@media (max-width: 600px) {
  .chart-container {
    aspect-ratio: 1160 / 700;
  }
}
</style>
</head>

<body>

<div class="chart-container" id="container">

<svg
  id="chart"
  viewBox="0 0 1160 620"
  aria-label="2016至2025年全国接报火灾数量动态折线图"
>

  <defs>
    <clipPath id="plotClip">
      <rect x="90" y="55" width="1000" height="465"/>
    </clipPath>
  </defs>

  <!-- 网格 -->
  <g id="grid"></g>

  <!-- 坐标 -->
  <g id="axis"></g>

  <!-- 折线及数据点 -->
  <g clip-path="url(#plotClip)">
    <path id="fireLine" class="fire-line"></path>
    <g id="points"></g>
  </g>

  <!-- 左上角单位 -->
  <text
    x="100"
    y="38"
    class="unit-label"
  >
    单位：万起
  </text>

</svg>

<!-- 鼠标悬停数据框 -->
<div class="tooltip" id="tooltip">
  <div class="tooltip-year" id="tipYear"></div>
  <div class="tooltip-value" id="tipValue"></div>
</div>

<!-- 重播按钮 -->
<button
  class="replay"
  id="replay"
  aria-label="重新播放动画"
  title="重新播放"
>
  <svg viewBox="0 0 24 24"
       fill="none"
       stroke="currentColor"
       stroke-width="1.8"
       stroke-linecap="round"
       stroke-linejoin="round">
    <path d="M3 11a9 9 0 1 1 2.5 6.3"/>
    <path d="M3 4v7h7"/>
  </svg>
</button>

</div>

<script>
// 2016—2025年全国接报火灾数量
// 单位：万起
const fireData = [
  { year: 2016, value: 31.2 },
  { year: 2017, value: 28.1 },
  { year: 2018, value: 23.7 },
  { year: 2019, value: 23.3 },
  { year: 2020, value: 25.2 },
  { year: 2021, value: 74.8 },
  { year: 2022, value: 82.5 },
  { year: 2023, value: 87.8 },
  { year: 2024, value: 90.8 },
  { year: 2025, value: 84.1 }
];

const svgNS = "http://www.w3.org/2000/svg";

const grid = document.getElementById("grid");
const axis = document.getElementById("axis");
const line = document.getElementById("fireLine");
const points = document.getElementById("points");

const container = document.getElementById("container");
const tooltip = document.getElementById("tooltip");
const tipYear = document.getElementById("tipYear");
const tipValue = document.getElementById("tipValue");

const replay = document.getElementById("replay");

let timers = [];
let activePoint = null;

// 绘图区尺寸
const chartArea = {
  left: 110,
  right: 1045,
  top: 85,
  bottom: 505
};

const maxValue = 100;

// 创建SVG元素
function createSVG(tag, attributes, parent) {
  const element = document.createElementNS(svgNS, tag);

  Object.entries(attributes).forEach(([key,value]) => {
    element.setAttribute(key,value);
  });

  if (parent) {
    parent.appendChild(element);
  }

  return element;
}

// 数据坐标
function getPoint(data,index) {
  const x =
    chartArea.left +
    index *
    (chartArea.right-chartArea.left) /
    (fireData.length-1);

  const y =
    chartArea.bottom -
    data.value / maxValue *
    (chartArea.bottom-chartArea.top);

  return {x,y};
}

const positions = fireData.map(getPoint);

// 创建网格与坐标
function drawAxes() {

  grid.replaceChildren();
  axis.replaceChildren();

  // Y轴刻度
  for (let value=0; value<=100; value+=20) {

    const y =
      chartArea.bottom -
      value/maxValue *
      (chartArea.bottom-chartArea.top);

    createSVG("line",{
      x1:chartArea.left,
      y1:y,
      x2:chartArea.right,
      y2:y,
      class:"grid-line"
    },grid);

    const text = createSVG("text",{
      x:91,
      y:y+6,
      "text-anchor":"end",
      class:"axis-label"
    },axis);

    text.textContent = value;
  }

  // X轴年份
  fireData.forEach((data,index) => {

    const text = createSVG("text",{
      x:positions[index].x,
      y:548,
      "text-anchor":"middle",
      class:"axis-label"
    },axis);

    text.textContent = data.year;
  });
}

// 显示悬停数据
function showTooltip(index,group) {

  activePoint = index;

  document.querySelectorAll(".point-group")
    .forEach(el => el.classList.remove("active"));

  group.classList.add("active");

  const data = fireData[index];
  const pos = positions[index];

  tipYear.textContent = data.year + "年";
  tipValue.textContent = data.value.toFixed(1) + " 万起";

  const rect = container.getBoundingClientRect();

  const left = pos.x / 1160 * rect.width;
  const top = pos.y / 620 * rect.height;

  tooltip.style.left =
    Math.max(75,Math.min(left,rect.width-75)) + "px";

  tooltip.style.top =
    Math.max(70,top-10) + "px";

  tooltip.classList.add("show");
}

function hideTooltip() {
  tooltip.classList.remove("show");
  activePoint = null;

  document.querySelectorAll(".point-group")
    .forEach(el => el.classList.remove("active"));
}

// 绘制折线与点
function createChart() {

  points.replaceChildren();

  const pathData = positions.map((pos,index) => {
    return (index===0 ? "M" : "L") +
      pos.x.toFixed(2) + "," +
      pos.y.toFixed(2);
  }).join(" ");

  line.setAttribute("d",pathData);

  positions.forEach((pos,index) => {

    const group = createSVG("g",{
      class:"point-group",
      tabindex:"0",
      role:"button",
      "aria-label":
        `${fireData[index].year}年，${fireData[index].value}万起`,
      style:"opacity:0;transition:opacity .3s ease"
    },points);

    createSVG("circle",{
      cx:pos.x,
      cy:pos.y,
      r:14,
      class:"point-ring"
    },group);

    createSVG("circle",{
      cx:pos.x,
      cy:pos.y,
      r:6,
      class:"fire-point"
    },group);

    // 扩大触摸范围
    createSVG("circle",{
      cx:pos.x,
      cy:pos.y,
      r:25,
      fill:"transparent",
      style:"cursor:pointer"
    },group);

    group.addEventListener("pointerenter",() => {
      showTooltip(index,group);
    });

    group.addEventListener("pointerdown",() => {
      showTooltip(index,group);
    });

    group.addEventListener("focus",() => {
      showTooltip(index,group);
    });

    group.addEventListener("keydown",e => {
      if(e.key==="Enter" || e.key===" ") {
        e.preventDefault();
        showTooltip(index,group);
      }
    });
  });
}

// 播放动画
function playAnimation() {

  timers.forEach(clearTimeout);
  timers = [];

  hideTooltip();

  const groups = [...document.querySelectorAll(".point-group")];

  groups.forEach(group => {
    group.style.opacity = "0";
  });

  line.style.transition = "none";

  const length = line.getTotalLength();

  line.style.strokeDasharray = length;
  line.style.strokeDashoffset = length;

  // 强制刷新动画状态
  line.getBoundingClientRect();

  // 折线绘制动画
  line.style.transition =
    "stroke-dashoffset 3.2s cubic-bezier(.2,.55,.3,1)";

  line.style.strokeDashoffset = "0";

  // 数据点依次出现
  groups.forEach((group,index) => {

    const timer = setTimeout(() => {
      group.style.opacity = "1";
    },index*350);

    timers.push(timer);
  });
}

// 初始化
drawAxes();
createChart();
playAnimation();

// 重播
replay.addEventListener("click",playAnimation);

// 点击空白处关闭提示框
document.addEventListener("pointerdown",event => {
  if (!event.target.closest(".point-group")) {
    hideTooltip();
  }
});

// 鼠标离开图表后关闭提示框
container.addEventListener("pointerleave",event => {
  if(event.pointerType==="mouse") {
    hideTooltip();
  }
});

// 页面大小改变后重新定位提示框
window.addEventListener("resize",() => {
  if(activePoint !== null) {
    const group = points.children[activePoint];
    showTooltip(activePoint,group);
  }
});
</script>

</body>
</html>
